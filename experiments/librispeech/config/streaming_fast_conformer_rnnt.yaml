# Relative paths are resolved from experiments/librispeech by the experiment scripts.
dataset:
  data_dir: data
  train_file: train.json
  valid_file: valid.json
  test_clean_file: test-clean.json
  test_other_file: test-other.json

tokenizer:
  tokenizer_dir: results/tokenizer

frontend:
  # A 512-sample FFT and 160-sample hop correspond to 32 ms and 10 ms at 16 kHz.
  sample_rate: 16000
  n_fft: 512
  hop_length: 160
  n_mels: 80
  f_min: 0.0
  f_max: 8000.0

spec_augment:
  num_frequency_masks: 2
  max_frequency_mask_width: 30
  num_time_masks: 2
  max_time_mask_width: 40

model:
  # The tokenizer is trained with --vocab_size 128. Startup validation fails
  # early if the saved tokenizer and this value do not match.
  vocab_size: 128

  encoder:
    hidden_size: 512
    num_heads: 8
    kernel_size: 31
    num_blocks: 12
    dropout_rate: 0.1
    conv_channels: 256
    feed_forward_expansion_factor: 4
    bias: true

    # Chunk sizes are measured after causal 8x subsampling. Following Section
    # 2.1, 60% of training batches use a sampled streaming mask and 40% use
    # full context: https://arxiv.org/abs/2306.08175
    min_chunk_size: 8
    max_chunk_size: 32
    streaming_mask_probability: 0.6

  prediction_network:
    hidden_size: 512
    num_layers: 1
    dropout_rate: 0.1

  joint_network:
    hidden_size: 640
    dropout_rate: 0.1
    bias: true

  # FastEmit encourages earlier non-blank emissions. The original LibriSpeech
  # Conformer experiments use 0.004: https://arxiv.org/abs/2010.11148
  fastemit_lambda: 0.004
  ctc_loss_weight: 0.3

train:
  seed: 42
  # Keep disabled for the first run because the Numba RNN-T loss is an external
  # kernel. Enable only after verifying torch.compile on the target environment.
  compile: false
  train_batch_size: 8
  valid_batch_size: 8
  epochs: 20
  grad_accum_steps: 8
  learning_rate: 1e-4
  weight_decay: 1e-2
  max_grad_norm: 1.0
  lr_scheduler_type: linear
  warmup_steps: 1000
  logging_steps: 10
  save_total_limit: 2
  dataloader_num_workers: 2
  dataloader_pin_memory: true
  # auto uses BF16 when supported, otherwise FP16 on CUDA and FP32 on CPU.
  # Explicit alternatives are bf16, fp16, and fp32.
  mixed_precision: auto
  out_dir: results/streaming_fast_conformer_rnnt
  # Set a Transformers checkpoint directory such as checkpoint-1000 to resume.
  checkpoint_path: null

evaluate:
  test_file: ${dataset.test_clean_file}
  model_path: ${train.out_dir}
  out_dir: results/streaming_fast_conformer_rnnt_evaluation
  beam_size: 5
  # Attention chunks contain 8 frames after 8x subsampling. A 640 ms audio
  # delivery interval supplies approximately one such chunk at a 10 ms hop.
  audio_chunk_duration_ms: 640
  chunk_size: 8
  # Set to a small positive value for a quick evaluation smoke test.
  max_samples: null

infer:
  model_path: ${train.out_dir}
  # Set this from the command line to an arbitrary WAV, FLAC, or other audio
  # file supported by SoundFile. Multi-channel audio is downmixed and audio is
  # resampled to frontend.sample_rate.
  input_path: null
  out_path: results/streaming_fast_conformer_rnnt_inference.json
  beam_size: 5
  audio_chunk_duration_ms: 640
  chunk_size: 8

hydra:
  # Keep execution in the launch directory and suppress Hydra's timestamped
  # output directory. Experiment artifacts are managed by Trainer instead.
  # https://hydra.cc/docs/tutorials/basic/running_your_app/working_directory/
  run:
    dir: .
  job:
    chdir: false
  output_subdir: null
  # https://hydra.cc/docs/configure_hydra/logging/
  job_logging:
    version: 1
    formatters:
      simple:
        format: "%(asctime)s - %(name)s - %(filename)s:%(lineno)d - %(levelname)s: %(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      handlers: [console]
    disable_existing_loggers: false
