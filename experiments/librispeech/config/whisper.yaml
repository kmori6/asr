# Relative paths are resolved from experiments/librispeech by the experiment scripts.
dataset:
  data_dir: data
  train_file: train.json
  valid_file: valid.json
  test_clean_file: test-clean.json
  test_other_file: test-other.json
  sample_rate: 16000

model:
  pretrained_model_name_or_path: openai/whisper-small
  language: english
  task: transcribe

train:
  seed: 42
  out_dir: results/whisper
  # A Transformers checkpoint directory resumes model, optimizer, scheduler,
  # scaler, trainer state, and the completed-step position. Null starts anew.
  checkpoint_path: null
  epochs: 3
  train_batch_size: 16
  valid_batch_size: 16
  grad_accum_steps: 4
  learning_rate: 1e-5
  weight_decay: 1e-2
  max_grad_norm: 1.0
  lr_scheduler_type: linear
  warmup_steps: 500
  logging_steps: 10
  save_total_limit: 2
  dataloader_num_workers: 2
  dataloader_pin_memory: true
  gradient_checkpointing: false
  compile: true
  # auto uses BF16 when supported, otherwise FP16 on CUDA and FP32 on CPU.
  # Explicit alternatives are bf16, fp16, and fp32.
  mixed_precision: auto

evaluate:
  test_file: ${dataset.test_clean_file}
  model_path: ${train.out_dir}
  out_dir: results/whisper_evaluation
  num_beams: 5
  max_new_tokens: 256
  # Set to a small positive value for a quick evaluation smoke test.
  max_samples: null

infer:
  model_path: ${train.out_dir}
  # Set this from the command line. Audio longer than 30 seconds is skipped.
  # SoundFile-supported multi-channel audio is downmixed and resampled to 16 kHz.
  input_path: null
  out_path: results/whisper_inference.json
  num_beams: 5
  max_new_tokens: 256

hydra:
  run:
    dir: .
  job:
    chdir: false
  output_subdir: null
  job_logging:
    version: 1
    formatters:
      simple:
        format: "%(asctime)s - %(name)s - %(filename)s:%(lineno)d - %(levelname)s: %(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      handlers: [console]
    disable_existing_loggers: false
