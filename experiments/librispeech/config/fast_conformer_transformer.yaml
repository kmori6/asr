# Relative paths are resolved from experiments/librispeech by the experiment scripts.
dataset:
  data_dir: data
  train_file: train.json
  valid_file: valid.json
  test_clean_file: test-clean.json
  test_other_file: test-other.json

tokenizer:
  tokenizer_dir: results/tokenizer

frontend:
  sample_rate: 16000
  n_fft: 512
  hop_length: 160
  n_mels: 80
  f_min: 0.0
  f_max: 8000.0

spec_augment:
  num_frequency_masks: 2
  max_frequency_mask_width: 30
  num_time_masks: 2
  max_time_mask_width: 40

model:
  vocab_size: 128
  # Joint objective: loss = weight * CTC + (1 - weight) * cross entropy.
  # The original joint CTC-attention study found 0.2 best on WSJ and CHiME-4.
  # https://arxiv.org/abs/1609.06773
  ctc_loss_weight: 0.2

  encoder:
    hidden_size: 512
    num_heads: 8
    kernel_size: 31
    num_blocks: 12
    dropout_rate: 0.1
    conv_channels: 256
    feed_forward_expansion_factor: 4
    bias: true

  decoder:
    # Transformer Base dimensions from Table 3 of Attention Is All You Need.
    # https://arxiv.org/abs/1706.03762
    hidden_size: 512
    num_layers: 6
    num_heads: 8
    feed_forward_size: 2048
    dropout_rate: 0.1
    label_smoothing: 0.1
    max_length: 512
    ignore_index: -100
    bias: true

train:
  seed: 42
  compile: true
  dataloader:
    train_batch_size: 16
    valid_batch_size: 16
    num_workers: 2
    pin_memory: true
  optimizer:
    lr: 1e-4
    weight_decay: 1e-2
    max_grad_norm: 1.0
  scheduler:
    warmup_steps: 1000
  epochs: 20
  grad_accum_steps: 4
  log_steps: 10
  out_dir: results/fast_conformer_transformer
  checkpoint_path: null

evaluate:
  test_file: ${dataset.test_clean_file}
  model_path: ${train.out_dir}/best_model.pt
  out_dir: results/fast_conformer_transformer_evaluation
  beam_size: 5
  max_new_tokens: 256
  length_penalty: 0.6
  max_samples: null

infer:
  model_path: ${train.out_dir}/best_model.pt
  input_path: null
  out_path: results/fast_conformer_transformer_inference.json
  beam_size: 5
  max_new_tokens: 256
  length_penalty: 0.6

hydra:
  run:
    dir: .
  job:
    chdir: false
  output_subdir: null
  job_logging:
    version: 1
    formatters:
      simple:
        format: "%(asctime)s - %(name)s - %(filename)s:%(lineno)d - %(levelname)s: %(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      handlers: [console]
    disable_existing_loggers: false
